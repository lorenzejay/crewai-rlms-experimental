[project]
name = "experimental_rlms"
version = "0.1.0"
description = "experimental-rlms using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "rlms>=0.1.0",
    "pymupdf>=1.24.0",
    "html2text>=2024.2.26",
]

[project.scripts]
research = "experimental_rlms.main:research"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
override-dependencies = [
    "openai>=2.14.0",
    "python-dotenv>=1.2.1",
]

[tool.crewai]
type = "flow"
